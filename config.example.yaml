# ---------------------------------------------------------------------------
# pi-music-agent configuration
# Copy to `config.yaml` and edit. The file `config.yaml` is git-ignored.
# ---------------------------------------------------------------------------

# Where source sheets are dropped and rendered pieces are written.
storage:
  inputDir: "./.input"        # drop PDF/image sheet music or ABC here
  dir: "./.output"            # rendered .abc / .svg / .html outputs
  # database: "./.output/index.db"   # uncomment to use SQLite index

# -------- LLM providers: one OpenAI-compatible client, switchable base_url --
providers:
  openrouter:
    baseUrl: "https://openrouter.ai/api/v1"
    # API key is read from OPENROUTER_API_KEY env var if `apiKey` is omitted.
    apiKey: ""               # or put the key here (config.yaml is git-ignored)
    headers:
      HTTP-Referer: "https://localhost/pi-music-agent"
      X-Title: "pi-music-agent"
  ollama:
    baseUrl: "http://localhost:11434/v1"
    apiKey: "ollama"         # Ollama ignores it, but the client requires a value

# -------- Role configuration: which provider/model plays which role ---------
# Default: Kimi K2.6 (open weights, modified-MIT licence) served through OpenRouter.
# Kimi is a "thinking" model: without `reasoning: { enabled: false }` it spends the
# whole token budget thinking (we measured 4096 tokens / 100+ s and an empty answer).
# Remove that line (and raise maxTokens to 16000+) if you want it to think; expect
# much slower runs.
roles:
  composer:
    provider: openrouter
    model: "moonshotai/kimi-k2.6"
    temperature: 0.9
    maxTokens: 8192
    reasoning: { enabled: false }
  critic:
    provider: openrouter
    model: "moonshotai/kimi-k2.6"
    temperature: 0.2
    maxTokens: 8192
    reasoning: { enabled: false }

  # --- Fully local example (install Ollama + `ollama pull qwen2.5:14b`) -----
  # composer: { provider: ollama, model: "qwen2.5:14b", temperature: 0.9 }
  # critic:   { provider: ollama, model: "qwen2.5:14b", temperature: 0.2 }

# -------- Validation: local abcjs (default) or the n8n webhook --------------
validation:
  backend: local             # "local" | "n8n"
  n8n:
    webhookUrl: "http://localhost:5678/webhook/notation-validation"
    timeoutMs: 15000

# -------- Sheet music -> ABC conversion (OMR stretch goal) -------------------
conversion:
  backend: "none"            # "none" | "n8n" | "local"
  n8n:                       # import src/convert/n8n-omr-workflow.json into n8n
    webhookUrl: "http://localhost:5678/webhook/omr-conversion"
    timeoutMs: 120000
  local:                     # "local" needs Audiveris + Python music21 installed
    audiveris: "audiveris"
    music21: "python"

# -------- Rendering ---------------------------------------------------------
render:
  prefer: ["abc2svg", "abcm2ps"]   # CLI tools tried in order (if installed)
  formats: ["svg", "html"]         # abcjs HTML viewer is always available
  abc2svgPath: "abc2svg"           # override with an absolute path if needed
  abcm2psPath: "abcm2ps"

# -------- Agent loop limits ------------------------------------------------
loop:
  maxValidationRetries: 5    # feed validation errors back to the composer
  maxIterations: 3           # compose/critique/revise cycles
  scoreThreshold: 8          # critic score (0-10) needed to stop early
